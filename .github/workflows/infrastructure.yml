name: Infrastructure

# Terraform from GitHub.
#   Pull request touching infra/  -> read-only plan, posted as a PR comment
#   Merge to master / Run workflow -> plan, then apply after approval in the `production` environment
# The very first apply runs from a laptop (it creates the roles this workflow uses).

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infrastructure.yml"]
  push:
    branches: [master]
    paths: ["infra/**", ".github/workflows/infrastructure.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency: terraform # one Terraform run at a time (state is also locked in S3)

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    if: github.event_name == 'pull_request' && vars.TERRAFORM_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.17"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"
      - run: terraform fmt -check -recursive
      - run: terraform validate -no-color
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -var-file=production.tfvars > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment the plan on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const summary = (plan.match(/^(Plan: .*|No changes\..*)$/m) || ['(see the job log)'])[0];
            // Keep the comment readable: the changed resources, not the refresh noise.
            const start = plan.indexOf('Terraform will perform');
            let body = start >= 0 ? plan.slice(start) : plan;
            if (body.length > 60000) body = body.slice(0, 60000) + '\n... (truncated; full plan in the job log)';
            const ok = '${{ steps.plan.outputs.exitcode }}' === '0';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan ${ok ? '' : '(failed)'}\n**${summary}**\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`,
            });
      - if: steps.plan.outputs.exitcode != '0'
        run: cat plan.txt && exit 1

  apply:
    if: github.event_name != 'pull_request' && vars.TERRAFORM_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    # Requires approval: the job waits until a reviewer approves it in the GitHub UI, and only
    # jobs in this environment can assume the apply role in AWS.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.17"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"
      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -var-file=production.tfvars -out=tfplan
      - name: Apply exactly that plan
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
      - name: Outputs
        run: terraform output -no-color url etl_schedules
